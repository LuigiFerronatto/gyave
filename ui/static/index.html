<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GYAVE — Conversa com o LAO</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">🔊 GYAVE <span class="subtitle">— Give Your Agents Voices</span></div>
      <div class="controls">
        <label>CLI:
          <select id="engineSelect">
            <option value="auto">Auto (melhor disponível)</option>
          </select>
        </label>
        <label>Voz:
          <select id="voiceSelect"></select>
        </label>
        <label>Captura:
          <select id="sttModeSelect">
            <option value="webspeech">Navegador (Web Speech, rápido)</option>
            <option value="local">Whisper local (melhor precisão)</option>
            <option value="openai">Whisper OpenAI (nuvem)</option>
          </select>
        </label>
        <button id="muteBtn" title="Silenciar/ativar voz">🔈</button>
      </div>
    </header>

    <main class="stage">
      <div class="mascot-area">
        <img id="mascot" src="/static/mascots/idle.png" alt="LAO" />
        <div id="stateLabel" class="state-label">pronto</div>
      </div>

      <div class="log" id="log"></div>
    </main>

    <footer class="composer">
      <button id="micBtn" class="mic-btn" title="Segure para falar (ou clique para alternar)">🎤</button>
      <input id="textInput" type="text" placeholder="Digite ou fale sua mensagem para o LAO..." />
      <button id="sendBtn" class="send-btn">Enviar</button>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
