<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GYAVE — Conversa com o LAO</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-spacer"></div>
      <div class="brand">
        <img src="/static/logo/gyave.png" alt="GYAVE — Give Your Agents Voices" class="brand-logo" />
      </div>

      <button id="settingsToggle" class="icon-btn" title="Configurações de voz">
        <i class="icon" data-icon="settings-2"></i>
      </button>
    </header>

    <div id="settingsPanel" class="settings-panel hidden">
      <div class="settings-grid">
        <label>
          <span>CLI / Engine</span>
          <select id="engineSelect">
            <option value="auto">Auto (melhor disponível)</option>
          </select>
        </label>
        <label>
          <span>Provedor de voz (TTS)</span>
          <select id="ttsProviderSelect"></select>
        </label>
        <label>
          <span>Voz</span>
          <select id="voiceSelect"></select>
        </label>
        <label>
          <span>Captura (STT)</span>
          <select id="sttModeSelect">
            <option value="webspeech">Navegador (Web Speech)</option>
            <option value="local">Whisper local</option>
            <option value="openai">Whisper OpenAI (nuvem)</option>
          </select>
        </label>
        <label class="slider-label">
          <span>Velocidade <b id="rateVal">+0%</b></span>
          <input type="range" id="rateSlider" min="-50" max="50" value="0" step="5" />
        </label>
        <label class="slider-label">
          <span>Volume <b id="volumeVal">+0%</b></span>
          <input type="range" id="volumeSlider" min="-50" max="50" value="0" step="5" />
        </label>
      </div>
    </div>

    <main class="stage">
      <!-- Solo mascot stage: no chat history visible by default, per user
           request — the mascot IS the interface. History lives in a
           slide-over panel toggled from the FAB's hover menu. -->
      <div class="mascot-area">
        <div id="engineBadge" class="engine-badge">
          <i class="icon" data-icon="cpu"></i>
          <span id="engineBadgeText">nenhum CLI ativado ainda</span>
        </div>
        <img id="mascot" src="/static/mascots/idle.png" alt="LAO" />
        <div id="stateLabel" class="state-label">pronto</div>
      </div>

      <!-- Collapsible chat history — hidden by default, opened via the
           FAB's hover menu ("Ver histórico"). -->
      <!-- Backdrop: clicking outside the panel closes it, same as the
           historyCloseBtn / re-toggle. -->
      <div id="historyBackdrop" class="history-backdrop hidden"></div>
      <aside id="historyPanel" class="history-panel hidden">
        <div class="history-header">
          <span>Histórico da conversa</span>
          <button id="historyCloseBtn" class="icon-btn small close-x" title="Fechar histórico">&times;</button>
        </div>
        <div class="log" id="log"></div>
      </aside>
    </main>

    <footer class="composer">
      <!-- Central FAB: the primary voice/mic control. Hovering reveals a
           small radial-ish menu with Histórico / Mutar, as requested —
           these used to be separate always-visible icon buttons. -->
      <div class="fab-wrap">
        <div class="fab-menu" id="fabMenu">
          <button id="historyToggleBtn" class="fab-menu-btn" title="Ver histórico">
            <i class="icon" data-icon="message-circle"></i>
          </button>
          <button id="muteBtn" class="fab-menu-btn" title="Silenciar/ativar voz">
            <i class="icon" data-icon="volume-2"></i>
          </button>
        </div>
        <button id="micBtn" class="mic-fab" title="Clique para falar">
          <i class="icon icon-invert icon-fab" data-icon="mic"></i>
        </button>
      </div>

      <!-- Text input stays separate from the FAB, docked to the right,
           and can be collapsed entirely when voice-only is preferred. -->
      <div class="composer-text" id="composerText">
        <input id="textInput" type="text" placeholder="Digite ou fale sua mensagem para o LAO..." />
        <button id="sendBtn" class="send-btn">
          <i class="icon icon-invert" data-icon="send"></i>
        </button>
      </div>
      <button id="composerTextToggle" class="icon-btn" title="Mostrar/ocultar campo de texto">
        <i class="icon" data-icon="chevron-down"></i>
      </button>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
